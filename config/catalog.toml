# Single source of truth for what the project audits.
#
#   providers  -> who sells the plan / runs the API
#   models     -> the model being compared (catalog slug, not the API id)
#   plans      -> flat-rate subscriptions, the things under audit
#   endpoints  -> OpenAI-compatible chat endpoints: one `official` reference per
#                 model, one `plan` endpoint per plan that serves it
#   audits     -> which plan endpoint is compared against which reference
#
# Prices and limits are a research snapshot (docs/research/landscape.md,
# 2026-10-20). Endpoint URLs and model ids come from vendor docs and are
# `verified = false` until `planaudit preflight` has called them.
#
# Any endpoint's base_url / model can be overridden at runtime with
# PLANAUDIT_<SLUG>_BASE_URL / PLANAUDIT_<SLUG>_MODEL (slug upper-cased,
# '-' and '.' -> '_').

snapshot = "2026-10-20"

# ---------------------------------------------------------------- providers

[[providers]]
slug = "zai"
name = "Z.ai"
maker_of = "GLM"
url = "https://z.ai/subscribe"

[[providers]]
slug = "moonshot"
name = "Moonshot AI"
maker_of = "Kimi"
url = "https://www.kimi.com/code"

[[providers]]
