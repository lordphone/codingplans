# Single source of truth for what the project audits.
#
#   providers  -> who sells the plan / runs the API
#   models     -> the model being compared (catalog slug, not the API id)
#   plans      -> flat-rate subscription products (with tiers): what is audited
#   endpoints  -> OpenAI-compatible chat endpoints: one `official` reference per
#                 model (the model maker's own pay-per-token API) and one `plan`
#                 endpoint per plan that serves it
#   audits     -> which plan endpoint is compared against which reference
#
# Facts are a research snapshot (docs/research/landscape.md, 2026-10-20).
# `confidence` per plan: "official" = read on the vendor's own pages,
# "mixed" = partly third-party, "third-party" = trackers/blogs only. Endpoint
# URLs and model ids are `verified = false` until `planaudit preflight` has
# called them. Prices change monthly; re-check before relying on them.
#
# Any endpoint's base_url / model can be overridden at runtime with
# PLANAUDIT_<SLUG>_BASE_URL / PLANAUDIT_<SLUG>_MODEL (slug upper-cased,
# '-' and '.' -> '_').

snapshot = "2026-10-20"
# Used only to show approximate USD next to CNY prices on the site.
fx = { CNY = 0.14 }

