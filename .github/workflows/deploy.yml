# Build the SvelteKit site (prerendered from Supabase at build time) and
# publish it to GitHub Pages. Runs on pushes to main, by hand, and after every
# completed audit/performance run so freshly ingested data goes live.
name: Deploy site

on:
  push:
    branches: ["main"]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Audit plans"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Check
        working-directory: web
        run: npm run check && npm run lint

      - name: Build
        working-directory: web
        env:
          BASE_PATH: /codingplans
          # Public by design (anon key, read-only via RLS). Stored as repo
          # variables, not secrets, so they are visible in logs.
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
