# Scheduled plan audits. Never runs on push: every run spends real API quota.
#
#   - speed probes 4×/day at staggered hours (peak-hour throttling shows up
#     as a time-of-day pattern in benchmark_runs)
#   - quick fidelity tier daily, standard tier weekly (Sunday)
#   - manual runs pick tier / group / target
#
# Requires the secrets listed in docs/REQUIREMENTS.md. Endpoints whose key
# secret is empty are skipped, so you can start with a single plan.
name: Audit plans

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"   # speed probes
    - cron: "41 3 * * *"           # quick fidelity tier
    - cron: "23 5 * * 0"           # standard fidelity tier
  workflow_dispatch:
    inputs:
      job:
        description: "performance | audit"
        default: audit
        type: choice
        options: [audit, performance]
      tier:
        description: "quick | standard | full"
        default: quick
        type: choice
        options: [quick, standard, full]
      group:
        description: "Audit group model_slug (blank = all)"
        default: ""
      target:
        description: "Only this plan endpoint slug (blank = all)"
        default: ""
      ingest:
        description: "Write results to Supabase"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # One audit at a time: plans meter concurrency and the stealth client is
  # sequential by design.
  group: audit
  cancel-in-progress: false

env:
  ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
  ZAI_CODING_PLAN_API_KEY: ${{ secrets.ZAI_CODING_PLAN_API_KEY }}
  MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
  KIMI_CODE_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
  MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
  MINIMAX_M_PLAN_API_KEY: ${{ secrets.MINIMAX_M_PLAN_API_KEY }}
  DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
  ALIBABA_CLOUD_MODEL_STUDIO_CODING_PLAN_API_KEY: ${{ secrets.ALIBABA_CLOUD_MODEL_STUDIO_CODING_PLAN_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Self-test (offline, no keys)
        run: python benchmarks/selftest.py

      # Reference artifacts are reused for 7 days across runs (one official
      # run feeds every plan audit for that model), so persist runs/ dirs.
      - uses: actions/cache@v4
        with:
          path: benchmarks/fidelity/*/runs
          key: fidelity-runs-${{ github.run_id }}
          restore-keys: fidelity-runs-

      - name: Decide what to run
        id: plan
        run: |
          job="${{ inputs.job }}"; tier="${{ inputs.tier }}"
          case "${{ github.event.schedule }}" in
            "17 1,7,13,19 * * *") job=performance ;;
            "41 3 * * *") job=audit; tier=quick ;;
            "23 5 * * 0") job=audit; tier=standard ;;
          esac
          echo "job=${job:-audit}" >> "$GITHUB_OUTPUT"
          echo "tier=${tier:-quick}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.ingest }}" = "true" ]; then
            echo "ingest=--ingest" >> "$GITHUB_OUTPUT"
          fi

      - name: Speed probes
        if: steps.plan.outputs.job == 'performance'
        run: |
          python benchmarks/audit/run_performance.py --samples 5 ${{ steps.plan.outputs.ingest }} \
            ${{ inputs.target && format('--target {0}', inputs.target) || '' }}

      - name: Fidelity audit
        if: steps.plan.outputs.job == 'audit'
        run: |
          set +e
          python benchmarks/audit/run_audit.py \
            ${{ inputs.group && format('--group {0}', inputs.group) || '--all' }} \
            ${{ inputs.target && format('--target {0}', inputs.target) || '' }} \
            --tier ${{ steps.plan.outputs.tier }} ${{ steps.plan.outputs.ingest }}
          code=$?
          # Exit 1 = a plan failed an audit: that is a finding, not a CI error.
          if [ "$code" -eq 1 ]; then echo "::warning::at least one plan failed an audit test"; exit 0; fi
          exit $code

      - name: Upload reports
        if: always() && steps.plan.outputs.job == 'audit'
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports-${{ github.run_id }}
          path: |
            benchmarks/audit/reports/
            benchmarks/fidelity/*/runs/*.summary.json
          if-no-files-found: ignore
          retention-days: 90
